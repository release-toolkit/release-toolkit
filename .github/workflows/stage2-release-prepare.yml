name: Stage 2: Release Prepare

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Prepare release information
        run: pnpm release prepare --base main --dev dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
