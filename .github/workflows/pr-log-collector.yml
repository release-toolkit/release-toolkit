name: prLogCollector — PR 日志收集

on:
  pull_request_review:
    branches: [dev]
    types: [submitted]

permissions:
  pull-requests: write
  contents: write

jobs:
  collect:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Collect PR changelog
        run: pnpm release collect --pr-number ${{ github.event.pull_request.number }} --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || {
            git commit -m "[bot] 自动更新 PR 描述体"
            git push origin ${{ github.event.pull_request.head.ref }}
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
